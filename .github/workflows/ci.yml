name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Test and package backend
        working-directory: server
        run: mvn -B -pl ruoyi-admin -am -DskipTests=false package
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - name: Install
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Lint game operations modules
        working-directory: web
        run: pnpm exec eslint src/views/game src/api/game
      - name: Build and generate auto-import declarations
        working-directory: web
        run: pnpm build:prod
      - name: Typecheck game operations modules
        working-directory: web
        run: |
          pnpm exec vue-tsc --noEmit > typecheck.log 2>&1 || true
          if grep -E 'src/(views/game|api/game)' typecheck.log; then
            echo 'Type errors found in game operations modules'
            exit 1
          fi
  containers:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: server
          push: false
          tags: game-admin-api:ci
      - uses: docker/build-push-action@v6
        with:
          context: web
          push: false
          tags: game-admin-web:ci
      - uses: aquasecurity/trivy-action@0.28.0
        with: { scan-type: fs, scan-ref: '.', severity: 'CRITICAL,HIGH', exit-code: '1' }
