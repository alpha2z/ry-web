name: Build and deploy
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      target_slot:
        description: Inactive deployment slot
        required: true
        type: choice
        options: [green, blue]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/game-admin-api
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/game-admin-web

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - id: vars
        run: echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ steps.vars.outputs.tag }}
            ${{ env.API_IMAGE }}:${{ github.ref_type == 'tag' && github.ref_name || 'main' }}
      - uses: docker/build-push-action@v6
        with:
          context: web
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:${{ steps.vars.outputs.tag }}
            ${{ env.WEB_IMAGE }}:${{ github.ref_type == 'tag' && github.ref_name || 'main' }}
  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            cd "${{ secrets.DEPLOY_PATH }}"
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            slot="${{ inputs.target_slot }}"
            if [ -z "$slot" ]; then
              active="$(cat deploy/active-slot 2>/dev/null || echo blue)"
              if [ "$active" = blue ]; then slot=green; else slot=blue; fi
            fi
            deploy/scripts/deploy.sh "${{ needs.publish.outputs.tag }}" "$slot"
